<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="overlay">
    <div id="pet-container">
      <div id="speech-bubble" class="hidden" aria-live="polite">
        <p id="speech-text"></p>
        <div class="bubble-tail"></div>
      </div>
      <div id="pet" role="img" aria-label="Desktop Pet" draggable="false"></div>
    </div>
  </div>
  <audio id="note-s" src="Sound/NoteS.mp3" preload="auto"></audio>
  <audio id="note-l" src="Sound/NoteL.mp3" preload="auto"></audio>
  <audio id="sfx-click" src="Sound/Click.wav" preload="auto"></audio>
  <audio id="sfx-move" src="Sound/MoveMent.wav" preload="auto"></audio>
  <audio id="sfx-show" src="Sound/ShowOff.wav" preload="auto"></audio>
  <audio id="sfx-hide" src="Sound/Snooze.wav" preload="auto"></audio>
  <script src="pet.js"></script>
</body>
</html>
